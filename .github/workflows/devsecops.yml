name: DevSecOps

# Pipeline de segurança do Ford One — roda em todo push/PR para dev e main.
# Cada job é uma barreira: se qualquer um falhar, o deploy não acontece.
# Detalhes e riscos cobertos em docs/CYBERSECURITY-SPRINT3.md (Atividade 1).
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch: {}

# Actions fixadas por SHA de commit (tag é mutável e já foi sequestrada em
# ataques de supply chain); o Dependabot atualiza os SHAs.
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # SARIF vai pra aba Security sempre; o build só quebra em severidade ERROR.
      - run: >
          semgrep scan
          --config p/owasp-top-ten --config p/nodejs --config p/typescript --config p/jwt
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - run: >
          semgrep scan
          --config p/owasp-top-ten --config p/nodejs --config p/typescript --config p/jwt
          --severity ERROR --error

  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # varre o histórico inteiro, não só o último commit
      # CLI direto (a gitleaks-action exige licença paga em repos de organização).
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  container:
    name: Container (Trivy image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t ford-backend:${{ github.sha }} .
      # Smoke: sem npm na imagem, o prisma (migrate deploy no boot) e o
      # usuário não-root precisam continuar funcionando.
      - run: |
          docker run --rm --entrypoint sh ford-backend:${{ github.sha }} -c \
            'test "$(id -u)" != 0 && ./node_modules/.bin/prisma --version && ! command -v npm'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ford-backend:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ford-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  iac:
    name: IaC (Trivy config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Dockerfile, render.yaml e docker-compose*.yml
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  deploy:
    name: Deploy (Render)
    needs: [build-test, sast, sca, secrets, container, iac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # render.yaml tem autoDeploy: false — o deploy só sai daqui, depois
      # de todas as barreiras acima passarem.
      - run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
