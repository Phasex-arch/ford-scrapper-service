name: Keep backend alive

# Render free tier hiberna depois de ~15 min sem tráfego (o próprio Render
# avisa: "will spin down with inactivity, which can delay requests by 50
# seconds or more"). Este ping a cada 10 min mantém o serviço acordado.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -sf https://ford-backend-pdvb.onrender.com/api/health || echo "Falhou, mas ok — o Render pode estar de boot"
